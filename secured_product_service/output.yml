---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose -f compose.yml -o output.yml convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: postgres
  name: postgres
spec:
  ports:
    - name: "5432"
      port: 5432
      targetPort: 5432
  selector:
    io.kompose.service: postgres

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose -f compose.yml -o output.yml convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: product-app
  name: product-app
spec:
  type: LoadBalancer
  ports:
    - name: "8080"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: product-app

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f compose.yml -o output.yml convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: postgres
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f compose.yml -o output.yml convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: postgres
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: customer_db
            - name: POSTGRES_PASSWORD
              value: secret
            - name: POSTGRES_USER
              value: user
          image: postgres:latest
          livenessProbe:
            exec:
              command:
                - pg_isready -U user -d customer_db
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          name: postgres-db
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: postgres-data
      restartPolicy: Always
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    io.kompose.service: postgres-data
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f compose.yml -o output.yml convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: product-app
  name: product-app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: product-app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f compose.yml -o output.yml convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: product-app
    spec:
      containers:
        - env:
            - name: SPRING_DATASOURCE_PASSWORD
              value: secret
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/customer_db
            - name: SPRING_DATASOURCE_USERNAME
              value: user
          image: vatsank/product-service:1.0
          name: product-app
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always

